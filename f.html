<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>স্ফুরণ-২০২৬ | Premium Edition</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #FFD700;
            --gold-light: #FDF5A9;
            --dark-glass: rgba(10, 10, 10, 0.7);
        }
        body { margin: 0; overflow: hidden; background: #000; color: white; font-family: 'Noto Serif Bengali', serif; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; }
        
        .hero { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; width: 100%; z-index: 10; pointer-events: none; }
        h1 { 
            font-size: 5rem; margin-bottom: 5px;
            background: linear-gradient(45deg, var(--gold), var(--gold-light), #D4AF37);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0px 4px 15px rgba(255, 215, 0, 0.4));
        }
        p { font-size: 1.5rem; letter-spacing: 2px; color: #ccc; text-shadow: 0 2px 10px rgba(0,0,0,0.8); }
        
        .controls { position: absolute; bottom: 8%; left: 50%; transform: translateX(-50%); z-index: 10; display: flex; gap: 20px; }
        button {
            background: rgba(255, 215, 0, 0.1); border: 1px solid rgba(255, 215, 0, 0.5);
            color: var(--gold); padding: 12px 35px; cursor: pointer; border-radius: 30px; font-size: 1.2rem;
            backdrop-filter: blur(10px); transition: all 0.4s ease; text-transform: uppercase; letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); font-family: inherit; font-weight: bold;
        }
        button:hover { background: var(--gold); color: black; box-shadow: 0 0 25px rgba(255, 215, 0, 0.6); transform: translateY(-3px); }
        
        /* Premium Gallery */
        .gallery {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; display: none; overflow-y: auto;
            background: var(--dark-glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            z-index: 20; padding: 60px 5%; box-sizing: border-box; scroll-behavior: smooth;
        }
        
        /* Custom Scrollbar */
        .gallery::-webkit-scrollbar { width: 8px; }
        .gallery::-webkit-scrollbar-track { background: #111; }
        .gallery::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 10px; }
        
        .gallery-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255, 215, 0, 0.3); padding-bottom: 20px; margin-bottom: 30px; }
        .gallery-header h2 { margin: 0; font-size: 2.5rem; color: var(--gold); font-weight: 700; letter-spacing: 1px; }
        .close-btn { font-size: 2.5rem; cursor: pointer; color: var(--gold); transition: 0.3s; line-height: 1; }
        .close-btn:hover { color: white; transform: rotate(90deg); text-shadow: 0 0 15px var(--gold); }
        
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        
        .media-card {
            border-radius: 12px; overflow: hidden; position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid rgba(255,215,0,0.2);
            transition: all 0.4s ease; background: #000; opacity: 0; transform: translateY(20px);
        }
        .media-card:hover { transform: translateY(-10px) scale(1.02); border-color: var(--gold); box-shadow: 0 15px 40px rgba(255,215,0,0.3); z-index: 2; }
        .media-card img { width: 100%; height: 250px; object-fit: cover; display: block; }
        .media-card iframe { width: 100%; height: 250px; border: none; display: block; }
        
        /* Loader */
        .loader-container { grid-column: 1 / -1; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 50vh; color: var(--gold); }
        .spinner { width: 50px; height: 50px; border: 3px solid rgba(255,215,0,0.3); border-top-color: var(--gold); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        /* Mobile */
        @media (max-width: 768px) {
            h1 { font-size: 3rem; }
            p { font-size: 1rem; }
            .gallery-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
            .media-card img, .media-card iframe { height: 180px; }
            .gallery-header h2 { font-size: 1.8rem; }
            button { padding: 10px 25px; font-size: 1rem; }
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    
    <div class="hero">
        <h1 id="main-title">স্ফুরণ-২০২৬</h1>
        <p id="sub-title">একটি সুন্দর বিদায় ও নতুন শুরু</p>
    </div>
    
    <div class="controls" id="btn-group">
        <button onclick="openGallery('photos')">স্মৃতির পাতা</button>
        <button onclick="openGallery('videos')">ভিডিও গ্যালারি</button>
    </div>

    <div class="gallery" id="gallery-view">
        <div class="gallery-header">
            <h2 id="gallery-title">গ্যালারি</h2>
            <span class="close-btn" onclick="closeGallery()">✖</span>
        </div>
        <div class="gallery-grid" id="gallery-grid"></div>
    </div>

    <script>
        // 1. Premium 3D Background (Celebratory Gold Particles)
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.getElementById('canvas-container').appendChild(renderer.domElement);
        
        const geo = new THREE.BufferGeometry();
        const particleCount = 4000; // Optimal for performance & beauty
        const pos = new Float32Array(particleCount * 3);
        const speeds = new Float32Array(particleCount);

        for(let i = 0; i < particleCount; i++) {
            pos[i*3] = (Math.random() - 0.5) * 15;
            pos[i*3+1] = (Math.random() - 0.5) * 15;
            pos[i*3+2] = (Math.random() - 0.5) * 15;
            speeds[i] = Math.random() * 0.02 + 0.005; // Upward speed
        }
        geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
        
        // Creating a subtle glow effect for particles
        const mat = new THREE.PointsMaterial({ 
            size: 0.03, color: 0xffd700, transparent: true, opacity: 0.8, 
            blending: THREE.AdditiveBlending 
        });
        const particles = new THREE.Points(geo, mat);
        scene.add(particles);
        camera.position.z = 5;
        
        function animate(){
            requestAnimationFrame(animate);
            const positions = particles.geometry.attributes.position.array;
            for(let i = 0; i < particleCount; i++) {
                positions[i*3+1] += speeds[i]; // Moving up (Celebratory effect)
                if(positions[i*3+1] > 7.5) positions[i*3+1] = -7.5; // Reset at bottom
            }
            particles.geometry.attributes.position.needsUpdate = true;
            particles.rotation.y += 0.0005;
            renderer.render(scene, camera);
        }
        animate();
        
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        // Initial Intro Animation
        gsap.from("#main-title", { duration: 2, y: 30, opacity: 0, ease: "power4.out", delay: 0.2 });
        gsap.from("#sub-title", { duration: 2, y: 20, opacity: 0, ease: "power3.out", delay: 0.6 });
        gsap.from("#btn-group", { duration: 1.5, y: 20, opacity: 0, ease: "power2.out", delay: 1.2 });
        
        // 2. Google Drive API Logic (Fixed for 1000+ files)
        const API_KEY = "AIzaSyBrUiAYNCCNK2dlX6l3OkqF-mUBPTHL2Mo";
        const dirs = {
            photos: "1XembQaBsw2S2MO2GLfQuSXW76s0RrFCj",
            videos: "1JjCg8omPVXdQRmM0pfebZoLckPcLP_ln"
        };
        
        async function fetchDriveFiles(id){
            try {
                // pageSize=1000 ensures all files (up to 1000) are loaded at once.
                let url = `https://www.googleapis.com/drive/v3/files?q='${id}'+in+parents&pageSize=1000&fields=files(id,mimeType)&key=${API_KEY}`;
                let res = await fetch(url);
                let data = await res.json();
                return data.files || [];
            } catch(e) { 
                console.error("Error fetching files:", e);
                return []; 
            }
        }
        
        async function openGallery(type){
            const gView = document.getElementById('gallery-view');
            const gGrid = document.getElementById('gallery-grid');
            
            document.getElementById('gallery-title').innerText = type === 'photos' ? "স্মৃতির পাতা (ছবিসমূহ)" : "ভিডিও গ্যালারি";
            gGrid.innerHTML = `
                <div class="loader-container">
                    <div class="spinner"></div>
                    <h3 style="margin-top:20px; font-weight:normal;">ফাইল লোড হচ্ছে, অনুগ্রহ করে অপেক্ষা করুন...</h3>
                </div>`;
            
            gView.style.display = 'block';
            gsap.fromTo(gView, { opacity: 0, scale: 1.05 }, { opacity: 1, scale: 1, duration: 0.6, ease: "power3.out" });
            
            let files = await fetchDriveFiles(dirs[type]);
            gGrid.innerHTML = '';
            
            if(files.length === 0) {
                gGrid.innerHTML = '<p style="text-align:center; width:100%; grid-column:1/-1;">কোনো ফাইল পাওয়া যায়নি অথবা ফোল্ডারে এক্সেস নেই।</p>';
                return;
            }
            
            // Build the DOM elements
            files.forEach((f, index) => {
                let card = document.createElement('div');
                card.className = 'media-card';
                
                if(f.mimeType.includes('video')){
                    let iframe = document.createElement('iframe');
                    iframe.src = `https://drive.google.com/file/d/${f.id}/preview`;
                    iframe.setAttribute('allowfullscreen', 'true');
                    card.appendChild(iframe);
                    gGrid.appendChild(card);
                } else if(f.mimeType.includes('image')){
                    let img = document.createElement('img');
                    img.src = `https://drive.google.com/thumbnail?id=${f.id}&sz=w800`;
                    img.loading = "lazy"; // Important for performance when loading 500+ images
                    card.appendChild(img);
                    gGrid.appendChild(card);
                }
            });

            // Animate items popping in
            gsap.to('.media-card', {
                opacity: 1, y: 0, duration: 0.6, stagger: 0.05, ease: "back.out(1.2)"
            });
        }
        
        function closeGallery(){
            gsap.to('#gallery-view', { 
                opacity: 0, scale: 1.05, duration: 0.4, ease: "power2.in",
                onComplete: () => { document.getElementById('gallery-view').style.display = 'none'; }
            });
        }
    </script>
</body>
</html>
