<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>স্ফুরণ-২০২৬ | The Ultimate Memorial</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #FFD700;
            --gold-light: #FDF5A9;
            --dark-glass: rgba(10, 10, 10, 0.75);
            --card-glass: rgba(255, 255, 255, 0.05);
        }
        body { margin: 0; overflow: hidden; background: #000; color: white; font-family: 'Noto Serif Bengali', serif; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; }
        
        .hero { position: absolute; top: 45%; left: 50%; transform: translate(-50%, -50%); text-align: center; width: 90%; max-width: 800px; z-index: 10; pointer-events: none; }
        h1 { 
            font-size: 5.5rem; margin-bottom: 0px; margin-top: 0;
            background: linear-gradient(45deg, var(--gold), var(--gold-light), #D4AF37);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0px 4px 15px rgba(255, 215, 0, 0.4));
        }
        .subtitle { font-size: 1.5rem; letter-spacing: 3px; color: #eee; text-shadow: 0 2px 10px rgba(0,0,0,0.8); margin-bottom: 20px; }
        
        .success-msg {
            display: inline-block; padding: 10px 25px; border-radius: 30px; font-size: 1.2rem;
            background: rgba(255, 215, 0, 0.15); border: 1px solid rgba(255, 215, 0, 0.4);
            color: var(--gold-light); margin-bottom: 30px; backdrop-filter: blur(5px);
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.2);
        }

        .controls { position: absolute; bottom: 8%; left: 50%; transform: translateX(-50%); z-index: 10; display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
        button {
            background: rgba(255, 215, 0, 0.1); border: 1px solid rgba(255, 215, 0, 0.6);
            color: var(--gold); padding: 12px 35px; cursor: pointer; border-radius: 30px; font-size: 1.2rem;
            backdrop-filter: blur(10px); transition: all 0.4s ease; text-transform: uppercase; letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); font-family: inherit; font-weight: bold; display: flex; align-items: center; gap: 10px;
        }
        button:hover { background: var(--gold); color: black; box-shadow: 0 0 25px rgba(255, 215, 0, 0.6); transform: translateY(-5px); }
        
        .gallery {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; display: none; overflow-y: auto;
            background: var(--dark-glass); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            z-index: 20; padding: 40px 5%; box-sizing: border-box; scroll-behavior: smooth;
        }
        
        .gallery::-webkit-scrollbar { width: 8px; }
        .gallery::-webkit-scrollbar-track { background: #111; }
        .gallery::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 10px; }
        
        .gallery-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255, 215, 0, 0.3); padding-bottom: 15px; margin-bottom: 30px; position: sticky; top: 0; z-index: 25; background: rgba(0,0,0,0.5); backdrop-filter: blur(10px); border-radius: 10px; padding: 15px 20px; }
        .gallery-header h2 { margin: 0; font-size: 2rem; color: var(--gold); font-weight: 700; }
        .close-btn { font-size: 2rem; cursor: pointer; color: var(--gold); transition: 0.3s; }
        .close-btn:hover { color: white; transform: rotate(90deg) scale(1.2); }
        
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; padding-bottom: 50px; }
        
        .media-card {
            border-radius: 12px; overflow: hidden; position: relative; cursor: pointer;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid rgba(255,215,0,0.2);
            transition: all 0.4s ease; background: #0a0a0a; aspect-ratio: 4/3;
        }
        .media-card:hover { transform: translateY(-8px) scale(1.03); border-color: var(--gold); box-shadow: 0 15px 40px rgba(255,215,0,0.3); z-index: 2; }
        .media-card img { width: 100%; height: 100%; object-fit: cover; display: block; transition: 0.5s; }
        .media-card:hover img { transform: scale(1.1); }
        
        .play-overlay {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 3rem; color: rgba(255,255,255,0.8); text-shadow: 0 0 15px rgba(0,0,0,0.8);
            pointer-events: none; transition: 0.3s;
        }
        .media-card:hover .play-overlay { color: var(--gold); transform: translate(-50%, -50%) scale(1.2); }
        
        #lightbox {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.98);
            z-index: 100; display: none; align-items: center; justify-content: center; flex-direction: column;
        }
        .lightbox-content {
            position: relative; width: 90vw; height: 75vh; max-width: 1200px; display: flex; justify-content: center; align-items: center;
        }
        .lightbox-content img { max-width: 100%; max-height: 100%; border-radius: 8px; box-shadow: 0 0 30px rgba(255,215,0,0.2); object-fit: contain; }
        .lightbox-content iframe { width: 100%; height: 100%; border: none; border-radius: 12px; box-shadow: 0 0 30px rgba(255,215,0,0.2); background: #000; }
        
        .lb-close { position: absolute; top: 20px; right: 30px; font-size: 2.5rem; color: white; cursor: pointer; transition: 0.3s; z-index: 101; }
        .lb-close:hover { color: var(--gold); }
        .lb-nav { position: absolute; top: 50%; transform: translateY(-50%); font-size: 3rem; color: rgba(255,255,255,0.5); cursor: pointer; transition: 0.3s; z-index: 101; padding: 20px; }
        .lb-nav:hover { color: var(--gold); }
        .lb-prev { left: 10px; }
        .lb-next { right: 10px; }
        
        .lb-toolbar { margin-top: 20px; display: flex; gap: 15px; }
        .lb-btn { background: rgba(255,255,255,0.1); border: 1px solid var(--gold); color: white; padding: 10px 25px; border-radius: 20px; cursor: pointer; font-size: 1.1rem; transition: 0.3s; display: flex; align-items: center; gap: 8px;}
        .lb-btn:hover { background: var(--gold); color: black; }
        
        .loader-container { grid-column: 1 / -1; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 50vh; color: var(--gold); }
        .spinner { width: 50px; height: 50px; border: 3px solid rgba(255,215,0,0.3); border-top-color: var(--gold); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        @media (max-width: 768px) {
            h1 { font-size: 3.5rem; }
            .subtitle { font-size: 1.1rem; }
            .success-msg { font-size: 1rem; padding: 8px 18px; }
            .gallery-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
            button { padding: 10px 20px; font-size: 1rem; }
            .lb-nav { font-size: 2rem; padding: 10px; }
            .lightbox-content { height: 65vh; width: 100vw; }
            .lb-close { top: 15px; right: 15px; font-size: 2rem; }
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    
    <div class="hero">
        <h1 id="main-title">স্ফুরণ-২০২৬</h1>
        <p class="subtitle" id="sub-title">একটি সুন্দর বিদায় ও নতুন শুরু</p>
        <div class="success-msg" id="success-msg">
            <i class="fas fa-check-circle"></i> অনুষ্ঠানটি ১০ এপ্রিল সফলভাবে সম্পন্ন হয়েছে
        </div>
    </div>
    
    <div class="controls" id="btn-group">
        <button onclick="openGallery('photos')"><i class="fas fa-camera-retro"></i> স্মৃতির পাতা</button>
        <button onclick="openGallery('videos')"><i class="fas fa-film"></i> ভিডিও গ্যালারি</button>
    </div>

    <div class="gallery" id="gallery-view">
        <div class="gallery-header">
            <h2 id="gallery-title">গ্যালারি</h2>
            <i class="fas fa-times close-btn" onclick="closeGallery()"></i>
        </div>
        <div class="gallery-grid" id="gallery-grid"></div>
    </div>

    <div id="lightbox">
        <i class="fas fa-times lb-close" onclick="closeLightbox()"></i>
        <i class="fas fa-chevron-left lb-nav lb-prev" onclick="changeSlide(-1)"></i>
        
        <div class="lightbox-content" id="lb-content"></div>
        
        <i class="fas fa-chevron-right lb-nav lb-next" onclick="changeSlide(1)"></i>
        
        <div class="lb-toolbar">
            <button class="lb-btn" onclick="downloadCurrent()"><i class="fas fa-download"></i> ডাউনলোড</button>
        </div>
    </div>

    <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.getElementById('canvas-container').appendChild(renderer.domElement);
        
        const geo = new THREE.BufferGeometry();
        const particleCount = 4000;
        const pos = new Float32Array(particleCount * 3);
        const speeds = new Float32Array(particleCount);

        for(let i = 0; i < particleCount; i++) {
            pos[i*3] = (Math.random() - 0.5) * 20;
            pos[i*3+1] = (Math.random() - 0.5) * 20;
            pos[i*3+2] = (Math.random() - 0.5) * 20;
            speeds[i] = Math.random() * 0.02 + 0.005;
        }
        geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
        
        const mat = new THREE.PointsMaterial({ size: 0.035, color: 0xffd700, transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending });
        const particles = new THREE.Points(geo, mat);
        scene.add(particles);
        camera.position.z = 6;
        
        let mouseX = 0; let mouseY = 0;
        document.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX - window.innerWidth / 2) * 0.002;
            mouseY = (e.clientY - window.innerHeight / 2) * 0.002;
        });

        function animate(){
            requestAnimationFrame(animate);
            const positions = particles.geometry.attributes.position.array;
            for(let i = 0; i < particleCount; i++) {
                positions[i*3+1] += speeds[i]; 
                if(positions[i*3+1] > 10) positions[i*3+1] = -10; 
            }
            particles.geometry.attributes.position.needsUpdate = true;
            particles.rotation.y += 0.0005;
            camera.position.x += (mouseX - camera.position.x) * 0.05;
            camera.position.y += (-mouseY - camera.position.y) * 0.05;
            camera.lookAt(scene.position);
            renderer.render(scene, camera);
        }
        animate();
        
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        gsap.from("#main-title", { duration: 1.5, y: -50, opacity: 0, ease: "bounce.out" });
        gsap.from("#sub-title", { duration: 1.5, opacity: 0, delay: 0.4 });
        gsap.from("#success-msg", { duration: 1.5, scale: 0.8, opacity: 0, delay: 0.8, ease: "back.out(1.5)" });
        gsap.from("#btn-group", { duration: 1.5, y: 30, opacity: 0, delay: 1.2 });

        const API_KEY = "AIzaSyBrUiAYNCCNK2dlX6l3OkqF-mUBPTHL2Mo";
        const dirs = { photos: "1XembQaBsw2S2MO2GLfQuSXW76s0RrFCj", videos: "1JjCg8omPVXdQRmM0pfebZoLckPcLP_ln" };
        
        let currentFiles = [];
        let currentIndex = 0;
        
        async function fetchDriveFiles(id){
            try {
                let url = `https://www.googleapis.com/drive/v3/files?q='${id}'+in+parents&pageSize=1000&fields=files(id,name,mimeType)&key=${API_KEY}`;
                let res = await fetch(url);
                let data = await res.json();
                return data.files || [];
            } catch(e) { return []; }
        }
        
        async function openGallery(type){
            const gView = document.getElementById('gallery-view');
            const gGrid = document.getElementById('gallery-grid');
            document.getElementById('gallery-title').innerHTML = type === 'photos' ? '<i class="fas fa-camera"></i> স্মৃতির পাতা' : '<i class="fas fa-video"></i> ভিডিও গ্যালারি';
            
            gGrid.innerHTML = `<div class="loader-container"><div class="spinner"></div><h3 style="margin-top:20px; font-weight:normal;">ফাইল লোড হচ্ছে...</h3></div>`;
            gView.style.display = 'block';
            gsap.fromTo(gView, { opacity: 0, y: 50 }, { opacity: 1, y: 0, duration: 0.5 });
            
            currentFiles = await fetchDriveFiles(dirs[type]);
            gGrid.innerHTML = '';
            
            if(currentFiles.length === 0) {
                gGrid.innerHTML = '<p style="text-align:center; width:100%; grid-column:1/-1;">কোনো ফাইল পাওয়া যায়নি।</p>';
                return;
            }
            
            currentFiles.forEach((f, index) => {
                let card = document.createElement('div');
                card.className = 'media-card';
                card.onclick = () => openLightbox(index);
                
                let img = document.createElement('img');
                img.src = `https://drive.google.com/thumbnail?id=${f.id}&sz=w600`;
                img.loading = "lazy";
                
                // Fallback icon if thumbnail fails
                img.onerror = function() {
                    this.src = 'https://via.placeholder.com/600x400/111/FFD700?text=Preview+Not+Available';
                };
                
                card.appendChild(img);
                
                if(f.mimeType.includes('video')){
                    let playIcon = document.createElement('i');
                    playIcon.className = "fas fa-play-circle play-overlay";
                    card.appendChild(playIcon);
                }
                gGrid.appendChild(card);
            });
            gsap.fromTo('.media-card', { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.5, stagger: 0.02 });
        }
        
        function closeGallery(){
            gsap.to('#gallery-view', { opacity: 0, y: 50, duration: 0.4, onComplete: () => { document.getElementById('gallery-view').style.display = 'none'; }});
        }

        const lightbox = document.getElementById('lightbox');
        const lbContent = document.getElementById('lb-content');
        
        function openLightbox(index){
            currentIndex = index;
            renderLightboxMedia();
            lightbox.style.display = 'flex';
            gsap.fromTo(lightbox, { opacity: 0, scale: 1.1 }, { opacity: 1, scale: 1, duration: 0.3 });
        }
        
        function renderLightboxMedia() {
            lbContent.innerHTML = '<div class="spinner"></div>';
            let f = currentFiles[currentIndex];
            
            if(f.mimeType.includes('video')) {
                let iframe = document.createElement('iframe');
                iframe.src = `https://drive.google.com/file/d/${f.id}/preview?autoplay=1`;
                iframe.allow = "autoplay; fullscreen";
                iframe.onload = () => { document.querySelector('#lb-content .spinner')?.remove(); };
                lbContent.appendChild(iframe);
            } else {
                let img = document.createElement('img');
                // Updated to use high-res thumbnail to bypass CORS/broken image issue
                img.src = `https://drive.google.com/thumbnail?id=${f.id}&sz=w1920`;
                img.onload = () => { document.querySelector('#lb-content .spinner')?.remove(); };
                lbContent.appendChild(img);
            }
        }
        
        function changeSlide(direction) {
            currentIndex += direction;
            if(currentIndex < 0) currentIndex = currentFiles.length - 1;
            if(currentIndex >= currentFiles.length) currentIndex = 0;
            
            gsap.fromTo(lbContent, { opacity: 0, x: direction * 50 }, { opacity: 1, x: 0, duration: 0.3 });
            renderLightboxMedia();
        }
        
        function closeLightbox() {
            gsap.to(lightbox, { opacity: 0, duration: 0.3, onComplete: () => {
                lightbox.style.display = 'none';
                lbContent.innerHTML = '';
            }});
        }
        
        function downloadCurrent() {
            let f = currentFiles[currentIndex];
            window.open(`https://drive.google.com/uc?export=download&id=${f.id}`, '_blank');
        }

        document.addEventListener('keydown', (e) => {
            if(lightbox.style.display === 'flex') {
                if(e.key === 'ArrowRight') changeSlide(1);
                if(e.key === 'ArrowLeft') changeSlide(-1);
                if(e.key === 'Escape') closeLightbox();
            }
        });
    </script>
</body>
</html>
