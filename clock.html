<!DOCTYPE html>
<html lang="en" class="no-scrollbar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elegance - Live Clock & Pro Weather</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <!-- Three.js (Optimized for GPU) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        heading: ['"Outfit"', 'sans-serif'],
                        mono: ['"Share Tech Mono"', 'monospace'],
                    },
                    colors: {
                        primary: '#6366f1',   
                        secondary: '#ec4899',
                        dark: '#050505',
                    },
                },
            },
        };
    </script>
    
    <style>
        body {
            background-color: #050505;
            color: #e2e8f0;
            overflow: hidden;
            user-select: none;
            cursor: default; 
        }

        /* --- 3D CANVAS (GPU Optimized) --- */
        #canvas-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
            z-index: -1; opacity: 0; transition: opacity 1.5s ease;
            background: radial-gradient(circle at center, #0a0f1d 0%, #000000 100%);
            will-change: transform; 
        }
        #canvas-container.loaded { opacity: 1; }

        /* --- PREMIUM GLASSMORPHISM --- */
        .glass-panel {
            background: rgba(15, 23, 42, 0.15);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.3);
        }

        .glass-pill {
            background: rgba(15, 23, 42, 0.35);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }

        /* PRELOADER */
        #preloader {
            position: fixed; inset: 0; background: #050505; z-index: 99999;
            display: flex; flex-direction: column; justify-content: center; align-items: center; 
            transition: transform 0.8s cubic-bezier(0.77, 0, 0.175, 1);
        }
        .progress-bar {
            width: 180px; height: 2px; background: rgba(255,255,255,0.1); margin-top: 20px; overflow: hidden;
        }
        .progress { width: 0%; height: 100%; background: #6366f1; transition: width 0.2s; }

        .ui-transition { transition: opacity 0.5s ease, transform 0.5s ease; }

        /* Remove Glow, keep a clean solid look */
        .clean-text {
            color: #ffffff;
            text-shadow: none; /* No glossy text */
        }
    </style>
</head>
<body class="antialiased font-sans h-screen flex flex-col justify-between p-6 md:p-10">

    <!-- Preloader -->
    <div id="preloader">
        <h2 class="text-2xl font-heading font-light tracking-[0.3em] text-white uppercase">Elegance UI</h2>
        <div class="progress-bar"><div class="progress" id="progress"></div></div>
    </div>

    <!-- 3D Particle Background -->
    <div id="canvas-container"></div>

    <!-- Header: Weather in Center, Controls on Right -->
    <header class="w-full flex justify-between items-start z-20 ui-element ui-transition relative">
        
        <!-- Empty Div to balance flexbox -->
        <div class="flex-1"></div>

        <!-- Center Weather Widget (Extra Features) -->
        <div class="absolute left-1/2 -translate-x-1/2 flex flex-col items-center glass-pill px-6 py-3 rounded-3xl cursor-default w-64 md:w-auto">
            <div class="flex items-center space-x-4">
                <div id="weather-icon-container" class="text-emerald-400">
                    <!-- Icon inject via JS -->
                    <svg class="w-8 h-8 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 10-9.78 2.096A4.001 4.001 0 003 15z"></path></svg>
                </div>
                <div class="flex flex-col text-left">
                    <div class="flex items-baseline space-x-2">
                        <span id="weather-temp" class="text-3xl font-bold text-white leading-none">--°</span>
                        <span id="weather-condition" class="text-xs text-slate-300 font-medium tracking-wide">Loading...</span>
                    </div>
                    <span class="text-[10px] text-slate-400 uppercase tracking-widest mt-1">Gopalganj, Bangladesh</span>
                </div>
            </div>
            
            <!-- Extra Weather Details -->
            <div class="w-full h-[1px] bg-white/10 my-2"></div>
            <div class="flex justify-between w-full text-[11px] text-slate-300 uppercase tracking-wider px-2">
                <span class="flex items-center gap-1"><svg class="w-3 h-3 text-blue-400" fill="currentColor" viewBox="0 0 24 24"><path d="M12 21.5c-3.58 0-6.5-2.92-6.5-6.5 0-3.32 2.65-6.9 6.22-11.83.15-.21.41-.21.56 0 3.57 4.93 6.22 8.51 6.22 11.83 0 3.58-2.92 6.5-6.5 6.5z"/></svg> <span id="weather-humidity">--%</span></span>
                <span class="flex items-center gap-1"><svg class="w-3 h-3 text-slate-400" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg> <span id="weather-wind">-- km/h</span></span>
            </div>
        </div>

        <!-- Right Controls -->
        <div class="flex-1 flex justify-end items-center space-x-3">
            <button id="toggle-format" class="glass-pill px-4 py-2 rounded-full text-xs font-bold tracking-widest text-slate-300 hover:text-white hover:bg-white/10 transition-all">
                12H
            </button>
            <button id="toggle-fullscreen" class="glass-pill p-2 rounded-full text-slate-300 hover:text-white hover:bg-white/10 transition-all" title="Toggle Fullscreen">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path></svg>
            </button>
        </div>
    </header>

    <!-- Main Clock & Date (Massive Size, No Glow) -->
    <main class="my-auto flex flex-col items-center justify-center z-20 text-center w-full">
        <div class="glass-panel p-8 md:p-12 rounded-[4rem] w-full max-w-6xl mx-auto cursor-default border-none bg-transparent shadow-none backdrop-blur-sm">
            
            <div class="flex items-baseline justify-center font-heading font-extrabold tracking-tighter leading-none">
                <!-- Massive Clock Numbers -->
                <span id="clock-hours" class="text-[8rem] md:text-[15rem] lg:text-[18rem] clean-text tracking-tighter">00</span>
                
                <span class="text-[6rem] md:text-[10rem] lg:text-[14rem] opacity-50 mx-2 text-primary animate-pulse pb-8 md:pb-16">:</span>
                
                <span id="clock-minutes" class="text-[8rem] md:text-[15rem] lg:text-[18rem] clean-text tracking-tighter">00</span>
                
                <div class="flex flex-col items-start ml-4 md:ml-8 space-y-2">
                    <span id="clock-seconds" class="text-4xl md:text-7xl font-mono text-primary/80 font-light">00</span>
                    <span id="clock-ampm" class="text-xl md:text-3xl font-bold tracking-widest text-slate-400 uppercase">AM</span>
                </div>
            </div>

            <!-- Date Display -->
            <div class="flex items-center justify-center gap-4 text-slate-300 font-light tracking-widest mt-6">
                <span id="date-day" class="text-2xl md:text-4xl font-semibold text-white uppercase">Sunday</span>
                <span class="text-white/30 text-2xl">•</span>
                <span id="date-full" class="text-xl md:text-3xl text-slate-300">August 02, 2026</span>
            </div>
        </div>
    </main>

    <!-- Footer Controls -->
    <footer class="w-full flex justify-between items-end z-20 ui-element ui-transition">
        
        <!-- Battery / Extra Status Info -->
        <div id="battery-status" class="glass-pill px-4 py-2 rounded-full flex items-center space-x-2 text-xs text-slate-300 font-mono hidden">
            <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7h16v10H4zM20 10h2v4h-2z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 10h6v4H6z"></path></svg>
            <span id="battery-level">100%</span>
        </div>
        
        <!-- Right side Footer elements -->
        <div class="flex flex-col items-end space-y-4 ml-auto">
            <!-- Theme Switcher -->
            <div class="flex items-center space-x-3 glass-pill px-4 py-2.5 rounded-full cursor-pointer">
                <span class="text-[10px] uppercase tracking-widest text-slate-400 font-semibold mr-1">Color</span>
                <button data-theme="indigo" class="theme-btn w-4 h-4 rounded-full bg-indigo-500 ring-2 ring-white/50 transition transform hover:scale-125"></button>
                <button data-theme="pink" class="theme-btn w-4 h-4 rounded-full bg-pink-500 opacity-60 hover:opacity-100 transition transform hover:scale-125"></button>
                <button data-theme="emerald" class="theme-btn w-4 h-4 rounded-full bg-emerald-400 opacity-60 hover:opacity-100 transition transform hover:scale-125"></button>
                <button data-theme="amber" class="theme-btn w-4 h-4 rounded-full bg-amber-400 opacity-60 hover:opacity-100 transition transform hover:scale-125"></button>
            </div>

            <button id="toggle-ui" class="glass-pill px-5 py-2.5 rounded-full text-xs font-semibold tracking-wider text-slate-300 hover:text-white flex items-center space-x-2 transition hover:bg-white/10">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"></path></svg>
                <span>Hide UI (Press 'H')</span>
            </button>
        </div>
    </footer>

    <!-- JavaScript Logic -->
    <script>
        // 1. LIVE WEATHER FETCH (Gopalganj) WITH EXTRA DATA
        async function fetchLiveWeather() {
            try {
                const lat = 23.0059; // Gopalganj Latitude
                const lon = 89.8266; // Gopalganj Longitude
                const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,wind_speed_10m,weather_code`;
                
                const response = await fetch(url);
                const data = await response.json();
                
                if (data && data.current) {
                    const temp = Math.round(data.current.temperature_2m);
                    const humidity = data.current.relative_humidity_2m;
                    const windSpeed = data.current.wind_speed_10m;
                    const weatherCode = data.current.weather_code;
                    
                    document.getElementById('weather-temp').textContent = `${temp}°`;
                    document.getElementById('weather-humidity').textContent = `${humidity}%`;
                    document.getElementById('weather-wind').textContent = `${windSpeed} km/h`;

                    // Simple WMO Weather Code Mapping
                    let condition = "Clear";
                    let iconSvg = `<svg class="w-8 h-8 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>`; // Sun
                    
                    if(weatherCode >= 1 && weatherCode <= 3) {
                        condition = "Cloudy";
                        iconSvg = `<svg class="w-8 h-8 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 10-9.78 2.096A4.001 4.001 0 003 15z"></path></svg>`;
                    } else if (weatherCode >= 51 && weatherCode <= 67) {
                        condition = "Rainy";
                        iconSvg = `<svg class="w-8 h-8 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 14.894A1.996 1.996 0 0117.894 13c-1.077 0-1.954.836-1.996 1.894M12 14.894A1.996 1.996 0 0110.894 13c-1.077 0-1.954.836-1.996 1.894M5 14.894A1.996 1.996 0 013.894 13C2.817 13 1.94 13.836 1.898 14.894M19 8c-1.38 0-2.5 1.12-2.5 2.5m-11-2.5C4.12 8 3 9.12 3 10.5m16-2.5A5.002 5.002 0 009.78 5.904 5 5 0 105.1 10.5"></path></svg>`;
                    } else if (weatherCode >= 71) {
                        condition = "Storm/Bad Weather";
                    }

                    document.getElementById('weather-condition').textContent = condition;
                    document.getElementById('weather-icon-container').innerHTML = iconSvg;
                }
            } catch (error) {
                console.error("Weather fetch failed:", error);
                document.getElementById('weather-temp').textContent = '--°'; 
                document.getElementById('weather-condition').textContent = 'Offline'; 
            }
        }
        
        fetchLiveWeather();
        setInterval(fetchLiveWeather, 600000); // 10 Min refresh

        // EXTRA FEATURE: Battery API
        if ('getBattery' in navigator) {
            navigator.getBattery().then(function(battery) {
                const batteryEl = document.getElementById('battery-status');
                const levelEl = document.getElementById('battery-level');
                batteryEl.classList.remove('hidden');
                
                function updateBatteryInfo() {
                    levelEl.textContent = Math.round(battery.level * 100) + '%';
                }
                updateBatteryInfo();
                battery.addEventListener('levelchange', updateBatteryInfo);
            });
        }

        // 2. CLOCK & DATE LOGIC
        let is24Hour = false;
        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            const ampm = hours >= 12 ? 'PM' : 'AM';

            if (!is24Hour) {
                hours = hours % 12;
                hours = hours ? hours : 12;
            }
            document.getElementById('clock-hours').textContent = String(hours).padStart(2, '0');
            document.getElementById('clock-minutes').textContent = minutes;
            document.getElementById('clock-seconds').textContent = seconds;
            document.getElementById('clock-ampm').textContent = is24Hour ? '' : ampm;

            const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            const months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
            
            document.getElementById('date-day').textContent = days[now.getDay()];
            document.getElementById('date-full').textContent = `${months[now.getMonth()]} ${String(now.getDate()).padStart(2, '0')}, ${now.getFullYear()}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        const toggleFormatBtn = document.getElementById('toggle-format');
        toggleFormatBtn.addEventListener('click', () => {
            is24Hour = !is24Hour;
            toggleFormatBtn.textContent = is24Hour ? '24H' : '12H';
            updateClock();
        });

        // 3. THREE.JS BACKGROUND (Highly Compressed & Optimized for GPU)
        let particleSystem, particleMaterial;
        const colorThemes = {
            indigo: { primary: 0x6366f1, secondary: 0xec4899, hex: '#6366f1' },
            pink: { primary: 0xec4899, secondary: 0x8b5cf6, hex: '#ec4899' },
            emerald: { primary: 0x10b981, secondary: 0x3b82f6, hex: '#10b981' },
            amber: { primary: 0xf59e0b, secondary: 0xef4444, hex: '#f59e0b' }
        };

        const initThreeJS = () => {
            const container = document.getElementById('canvas-container');
            const scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x050505, 0.0015);
            
            const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 1, 2000);
            camera.position.z = 1000;
            
            const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: false }); 
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5)); 
            container.appendChild(renderer.domElement);

            const geometry = new THREE.BufferGeometry();
            const particles = 500; // Super low count for Max GPU perf
            const positions = new Float32Array(particles * 3);
            const colors = new Float32Array(particles * 3);
            
            const color1 = new THREE.Color(colorThemes.indigo.primary);
            const color2 = new THREE.Color(colorThemes.indigo.secondary);
            
            for (let i = 0; i < positions.length; i += 3) {
                positions[i] = (Math.random() - 0.5) * 3200;
                positions[i + 1] = (Math.random() - 0.5) * 3200;
                positions[i + 2] = (Math.random() - 0.5) * 3200;
                
                const mixedColor = color1.clone().lerp(color2, Math.random());
                colors[i] = mixedColor.r;
                colors[i + 1] = mixedColor.g;
                colors[i + 2] = mixedColor.b;
            }
            
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            
            particleMaterial = new THREE.PointsMaterial({
                size: 4,
                vertexColors: true,
                transparent: true,
                opacity: 0.8,
                sizeAttenuation: true
            });
            
            particleSystem = new THREE.Points(geometry, particleMaterial);
            scene.add(particleSystem);

            let mouseX = 0, mouseY = 0;
            const windowHalfX = window.innerWidth / 2;
            const windowHalfY = window.innerHeight / 2;

            document.addEventListener('mousemove', (event) => {
                mouseX = (event.clientX - windowHalfX);
                mouseY = (event.clientY - windowHalfY);
            });

            const animate = () => {
                requestAnimationFrame(animate);
                
                particleSystem.rotation.x += 0.0002;
                particleSystem.rotation.y += 0.0004;
                
                camera.position.x += (mouseX * 0.2 - camera.position.x) * 0.02;
                camera.position.y += (-mouseY * 0.2 - camera.position.y) * 0.02;
                camera.lookAt(scene.position);
                
                renderer.render(scene, camera);
            };
            animate();

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            setTimeout(() => { container.classList.add('loaded'); }, 100);
        };

        // 4. THEME SWITCHING LOGIC
        document.querySelectorAll('.theme-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const themeKey = e.target.getAttribute('data-theme');
                const theme = colorThemes[themeKey];
                
                document.querySelectorAll('.theme-btn').forEach(b => b.classList.add('opacity-60'));
                e.target.classList.remove('opacity-60');

                const geometry = particleSystem.geometry;
                const colors = geometry.attributes.color.array;
                const c1 = new THREE.Color(theme.primary);
                const c2 = new THREE.Color(theme.secondary);

                for (let i = 0; i < colors.length; i += 3) {
                    const mixed = c1.clone().lerp(c2, Math.random());
                    colors[i] = mixed.r;
                    colors[i + 1] = mixed.g;
                    colors[i + 2] = mixed.b;
                }
                geometry.attributes.color.needsUpdate = true;

                document.documentElement.style.setProperty('--primary-color', theme.hex);
            });
        });

        // 5. HIDE UI / CLEAN WALLPAPER MODE
        let uiVisible = true;
        const uiElements = document.querySelectorAll('.ui-element');
        const toggleUiBtn = document.getElementById('toggle-ui');

        function toggleUI() {
            uiVisible = !uiVisible;
            uiElements.forEach(el => {
                el.style.opacity = uiVisible ? '1' : '0';
                el.style.pointerEvents = uiVisible ? 'auto' : 'none';
            });
        }

        toggleUiBtn.addEventListener('click', toggleUI);
        window.addEventListener('keydown', (e) => {
            if (e.key === 'h' || e.key === 'H') toggleUI();
        });

        // 6. FULLSCREEN TOGGLE
        const toggleFullscreenBtn = document.getElementById('toggle-fullscreen');
        toggleFullscreenBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => console.log(err));
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        });

        // Preloader Logic
        const preloader = document.getElementById('preloader');
        const progressBar = document.getElementById('progress');
        let loadProgress = 0;

        const simulateLoading = setInterval(() => {
            loadProgress += 30;
            progressBar.style.width = `${loadProgress}%`;
            if (loadProgress >= 100) {
                clearInterval(simulateLoading);
                setTimeout(() => {
                    preloader.style.transform = 'translateY(-100%)';
                    setTimeout(() => {
                        preloader.style.display = 'none';
                        initThreeJS();
                    }, 500);
                }, 200);
            }
        }, 100);
    </script>
</body>
</html>
